# Page Checks (Jonna, Nov 7, 2026; the checks moved to tools/page_checks.js on Nov 8, 2026 so Publish a Version runs
# exactly the same ones). Runs on every save of a page. Fails (and GitHub emails the person who saved) when:
#   - a script on the page doesn't parse, so the page would break
#   - something that looks like a key or token slipped into a page
#   - the test copy could save, or the live page couldn't
#   - the page safety list (Content-Security-Policy) is missing
#   - index.html was uploaded by hand instead of made live with Publish a Version
#   - the test copy is more than the live page plus its three test-only parts (tools/test_copy.py), so it couldn't publish
name: Page Checks
on:
  push:
    paths:
      - "**.html"
      - "tools/**"
      - "releases/index.json"
      - ".github/workflows/page-checks.yml"
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pages parse, no secrets, saving set right, safety list present, live page is a published version
        run: node tools/page_checks.js
      - name: The test copy can be published
        run: python3 tools/test_copy.py check
